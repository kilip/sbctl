# LEFTHOOK
# Refer for explanation to following link:
# https://lefthook.dev/configuration/

pre-commit:
  parallel: false
  commands:
    gen-schema:
      run: task gen-schema && git add docs/config-schema.json
    fix:
      run: task fix
    test:
      run: task test

commit-msg:
  commands:
    lint:
      run: commitlint lint --msg {1}
