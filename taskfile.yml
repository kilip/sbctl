version: '3'

vars:
  BINARY_NAME: sbctl

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list

  setup:
    desc: Install required tools and setup git hooks
    cmds:
      - go install github.com/evilmartians/lefthook@latest
      - go install github.com/conventionalcommit/commitlint@latest
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - lefthook install
      - task: gen-schema
      - echo "Setup complete. Tools installed and git hooks synchronized."

  gen-schema:
    desc: Generate JSON Schema for configuration
    cmds:
      - go run cmd/gen-schema/main.go

  fmt:
    desc: Format the code
    cmds:
      - go fmt ./...

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run unit tests
    cmds:
      - go test -v -race ./...

  coverage:
    desc: Run tests and print statement-by-statement coverage stats
    cmds:
      - go test -coverprofile=coverage.out ./internal/...
      - go tool cover -func=coverage.out

  coverage-html:
    desc: Run tests and generate HTML coverage report
    cmds:
      - go test -coverprofile=coverage.out ./internal/...
      - go tool cover -html=coverage.out

  build:
    desc: Build the binary
    cmds:
      - go build -o bin/{{.BINARY_NAME}} ./cmd/sbctl

  fix:
    desc: Run all formatting and tidying tasks
    cmds:
      - task: fmt
      - task: tidy
      - task: lint
